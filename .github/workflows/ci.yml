name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Créer local.properties factice pour le build CI
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=placeholder-anon-key" >> local.properties

      - name: Build Android debug
        run: ./gradlew :androidApp:assembleDebug

      - name: Tests du module shared
        run: ./gradlew :shared:testDebugUnitTest